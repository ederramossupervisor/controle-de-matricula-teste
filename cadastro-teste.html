<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de Cadastro de Aluno</title>
</head>
<body style="font-family: sans-serif; max-width: 400px; margin: 40px auto;">
  <h2>Teste de Cadastro de Aluno</h2>
  <input id="email" placeholder="E-mail da secretaria" style="width:100%; padding:8px; margin-bottom:8px;"><br>
  <input id="nome" placeholder="Nome do aluno" style="width:100%; padding:8px; margin-bottom:8px;"><br>
  <input id="responsavel" placeholder="Responsável" style="width:100%; padding:8px; margin-bottom:8px;"><br>
  <input id="telefone" placeholder="Telefone" style="width:100%; padding:8px; margin-bottom:8px;"><br>
  <input id="turma" placeholder="Turma" style="width:100%; padding:8px; margin-bottom:8px;"><br>
  <button onclick="testarCadastro()" style="padding:8px 16px;">Cadastrar</button>
  <pre id="resultado" style="background:#f4f4f4; padding:12px; margin-top:16px;"></pre>

  <script>
    async function testarCadastro() {
      const corpo = {
        email: document.getElementById('email').value,
        nome: document.getElementById('nome').value,
        responsavel: document.getElementById('responsavel').value,
        telefone: document.getElementById('telefone').value,
        turma: document.getElementById('turma').value
      };
      const resp = await fetch('/api/cadastrar-aluno', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
      const dados = await resp.json();
      document.getElementById('resultado').textContent = JSON.stringify(dados, null, 2);
    }
  </script>
</body>
</html>
